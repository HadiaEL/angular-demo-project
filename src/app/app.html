<app-header/>

<main>
  <ul id="users"> 
    @for (user of users; track user.id) {
      <li>
        <app-user [user]="user" (selected)="onSelectedUser($event)" />
      </li>
    }
  </ul>

  @if (selectedUser) {
    <app-tasks [name]="selectedUser.name"/>
  } @else {
    <p id="no-user-selected">Please select a user to see their tasks.</p>
  }

</main>
